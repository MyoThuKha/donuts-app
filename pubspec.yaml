name: donuts
description: "J'Donuts customer app"
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: ^3.14.0

dependencies:
  cached_network_image: ^4.0.7
  connectivity_plus: ^7.3.2
  cupertino_ui: ^1.1.6
  dio: ^5.11.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_cache_manager: ^3.5.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.4
  freezed_annotation: ^3.1.0
  get_it: ^9.3.0
  go_router: ^18.1.4
  intl: ^0.20.3
  json_annotation: ^4.12.0
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.1.0
  package_info_plus: ^10.2.2
dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  freezed: ^4.0.3
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/nunito/OFL.txt
    - assets/fonts/schibsted_grotesk/OFL.txt
    - assets/icons/
    - assets/images/
    - assets/images/welcome/
    - assets/logos/
    - assets/seed/
    - assets/seed/images/home/
    - assets/seed/images/home/donuts/
    - assets/seed/images/rewards/

  fonts:
    - family: SchibstedGrotesk
      fonts:
        - asset: assets/fonts/schibsted_grotesk/SchibstedGrotesk-Regular.ttf
          weight: 400
        - asset: assets/fonts/schibsted_grotesk/SchibstedGrotesk-Medium.ttf
          weight: 500
        - asset: assets/fonts/schibsted_grotesk/SchibstedGrotesk-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/schibsted_grotesk/SchibstedGrotesk-Bold.ttf
          weight: 700
        - asset: assets/fonts/schibsted_grotesk/SchibstedGrotesk-ExtraBold.ttf
          weight: 800
    - family: Nunito
      fonts:
        - asset: assets/fonts/nunito/Nunito-Medium.ttf
          weight: 500
        - asset: assets/fonts/nunito/Nunito-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/nunito/Nunito-Bold.ttf
          weight: 700
        - asset: assets/fonts/nunito/Nunito-ExtraBold.ttf
          weight: 800
    # Myanmar script, which the two fonts above don't cover.
    - family: NotoSansMyanmar
      fonts:
        - asset: assets/fonts/noto_sans_myanmar/NotoSansMyanmar-Regular.ttf
          weight: 400
        - asset: assets/fonts/noto_sans_myanmar/NotoSansMyanmar-Medium.ttf
          weight: 500
        - asset: assets/fonts/noto_sans_myanmar/NotoSansMyanmar-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/noto_sans_myanmar/NotoSansMyanmar-Bold.ttf
          weight: 700
        - asset: assets/fonts/noto_sans_myanmar/NotoSansMyanmar-ExtraBold.ttf
          weight: 800
