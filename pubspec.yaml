name: donuts
description: "J'Donuts customer app"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.14.0

dependencies:
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  equatable: ^3.0.0
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  get_it: ^9.3.0
  go_router: ^18.1.4
  intl: ^0.20.3
  lucide_icons_flutter: ^4.0.3
  material_ui: ^1.1.0
dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.17.1
  drift_dev: ^2.35.3
  fake_async: ^1.3.3
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.5
  very_good_analysis: ^11.0.0

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/fonts/OFL.txt

  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
